[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-backtester"
version = "0.1.0"
description = "Vectorized momentum strategy backtester with transaction costs, slippage, survivorship-bias modeling, risk parity / mean-variance optimization, and risk-adjusted performance metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Djallil Azouz" }]
keywords = [
    "quantitative-finance",
    "backtesting",
    "momentum",
    "portfolio-optimization",
    "risk-parity",
    "mean-variance-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/trojanhorse01/momentum-backtester"
Repository = "https://github.com/trojanhorse01/momentum-backtester"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
